apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-scheduler-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: green-scheduler-webhook
  template:
    metadata:
      labels:
        app: green-scheduler-webhook
    spec:
      containers:
        - name: webhook
          image: green-edge-webhook:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /metrics
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: green-scheduler-webhook
spec:
  selector:
    app: green-scheduler-webhook
  ports:
    - port: 5000
      targetPort: 5000
  type: NodePort